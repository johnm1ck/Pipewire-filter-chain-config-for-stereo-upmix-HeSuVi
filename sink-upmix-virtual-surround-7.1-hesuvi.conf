# Stereo to 7.1 upmix to Binaural Stereo
#
# Copy this file into a conf.d/ directory such as
# ~/.config/pipewire/filter-chain.conf.d/
#
context.modules = [
    {   name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "Stereo to 7.1 upmix to Binaural Stereo"
            media.name       = "Stereo to 7.1 upmix to Binaural Stereo"
            filter.graph = {
                nodes = [
                    # copy input
                    {   type = builtin name = copyFL label = copy }
                    {   type = builtin name = copyFR label = copy }

                    {
                        name    = mixF
                        type    = builtin
                        label   = mixer
                        control = {
                            "Gain 1" = 0.707106769084930419921875
                            "Gain 2" = 0.707106769084930419921875
                        }
                    }
                    {
                        name    = eq
                        type    = builtin
                        label   = param_eq
                        config = {
                            # FL
                            filters1 = [
				#{ type = bq_highpass freq = 23 },
                                #{ type = bq_highpass freq = 40 q = 1.33 },
				#{ type = bq_highpass freq = 44 q = 1.67 },
				{ type = bq_peaking  freq = 415  q = 0.4567 gain = 3.34567 },
                                { type = bq_peaking  freq = 830 q = 0.4567 gain = 3.67 },
				{ type = bq_peaking  freq = 1660 q = 0.4567 gain = 3.67 },
                                { type = bq_peaking  freq = 2600 q = 0.4567 gain = 3.34567 },
                                #{ type = bq_peaking  freq = 5100 q = 0.4567   gain = -0.2367 },
                                { type = bq_peaking  freq = 9200 q = 0.4567 gain = 0.567 },
				{ type = bq_peaking  freq = 12000 q = 0.4567  gain = 7.69 }
                            ]
                            # FR
                            filters2 = [
				#{ type = bq_highpass freq = 23 },
                                #{ type = bq_highpass freq = 40 q = 1.33 },
				#{ type = bq_highpass freq = 44 q = 1.67 },
				{ type = bq_peaking  freq = 415  q = 0.4567 gain = 3.34567 },
                                { type = bq_peaking  freq = 830 q = 0.4567 gain = 3.67 },
				{ type = bq_peaking  freq = 1660 q = 0.4567 gain = 3.67 },
                                { type = bq_peaking  freq = 2700 q = 0.4567 gain = 3.34567 },
                                #{ type = bq_peaking  freq = 5100 q = 0.4567   gain = -0.2367 },
                                { type = bq_peaking  freq = 9200 q = 0.4567 gain = 0.567 },
				{ type = bq_peaking  freq = 12000 q = 0.4567  gain = 7.69 }
                            ]
                            # FC
                            filters3 = [
				#{ type = bq_highpass freq = 23 },
                                #{ type = bq_lowshelf freq = 40 gain = -20.0 },
				#{ type = bq_highpass freq = 44 q = 1 },
                                #{ type = bq_peaking  freq = 0.2367 q = 1.414  gain = 3.34567 },
				{ type = bq_peaking  freq = 515  q = 0.4567 gain = 3.34567 },
                                { type = bq_peaking  freq = 930 q = 0.4567 gain = 3.67 },
				{ type = bq_peaking  freq = 1760 q = 0.4567 gain = 3.67 },
                                { type = bq_peaking  freq = 2700 q = 0.4567 gain = 3.34567 },
                                #{ type = bq_peaking  freq = 5900 q = 0.4567   gain = -0.2367 },
                                { type = bq_peaking  freq = 8300 q = 0.4567 gain = 0.567 },
				{ type = bq_peaking  freq = 11000 q = 0.4567  gain = 7.69 }
                            ]
                            # LFE
                            filters4 = [
				#{ type = bq_highpass freq = 23 },

				#{ type = bq_peaking freq = 44 q = 0.4567 gain = 6.678 },
				#{ type = bq_peaking freq = 66 q = 0.4567 gain = 6.432 },
				#{ type = bq_peaking freq = 88 q = 0.4567 gain = 6.269 },
				#{ type = bq_peaking freq = 110 q = 0.4567 gain = 5.669 },
				#{ type = bq_peaking freq = 154 q = 0.4567 gain = 5.132 },
				{ type = bq_peaking freq = 44 q = 0.0067 gain = 6.67 },
				{ type = bq_peaking freq = 55 q = 0.0067 gain = 8.67 },
				{ type = bq_peaking freq = 66 q = 0.0067 gain = 10.67 },
				#{ type = bq_peaking freq = 77 q = 0.0067 gain = 2.67 },
                                { type = bq_lowpass freq = 120 },
                                { type = bq_lowpass freq = 140 },
				#{ type = bq_highpass freq = 5 }
				#{ type = bq_peaking freq = }
                            ]
                            # RL
                            filters5 = [
				#{ type = bq_highpass freq = 23 },
                                #{ type = bq_highpass freq = 60 q = 0.707 },
				#{ type = bq_highpass freq = 132 q = 1.67 },
				{ type = bq_peaking  freq = 530  q = 0.4567 gain = 3.34567 },
                                { type = bq_peaking  freq = 1060 q = 0.4567 gain = 3.67 },
				{ type = bq_peaking  freq = 1800 q = 0.4567 gain = 3.67 },
                                { type = bq_peaking  freq = 2800 q = 0.4567 gain = 3.34567 },
                                #{ type = bq_peaking  freq = 5400 q = 0.4567   gain = -0.2367 },
                                { type = bq_peaking  freq = 8900 q = 0.4567 gain = 0.567 },
				{ type = bq_peaking  freq = 12500 q = 0.4567  gain = 7.69 }
                            ]
                            # RR
                            filters6 = [
				#{ type = bq_highpass freq = 23 },
                                #{ type = bq_highpass freq = 60 q = 0.707 },
				#{ type = bq_highpass freq = 132 q = 1.67 },
				{ type = bq_peaking  freq = 530  q = 0.4567 gain = 3.34567 },
                                { type = bq_peaking  freq = 1060 q = 0.4567 gain = 3.67 },
				{ type = bq_peaking  freq = 1800 q = 0.4567 gain = 3.67 },
                                { type = bq_peaking  freq = 2800 q = 0.4567 gain = 3.34567 },
                                #{ type = bq_peaking  freq = 5400 q = 0.4567   gain = -0.2367 },
                                { type = bq_peaking  freq = 8900 q = 0.4567 gain = 0.567 },
				{ type = bq_peaking  freq = 12500 q = 0.4567  gain = 7.69 }
                            ]
                            # SL
                            filters7 = [
				#{ type = bq_highpass freq = 23 },
                                #{ type = bq_highpass freq = 40 q = 1.33 },
				#{ type = bq_highpass freq = 88 q = 1.67 },
				{ type = bq_peaking  freq = 630  q = 0.4567 gain = 3.34567 },
                                { type = bq_peaking  freq = 1260 q = 0.4567 gain = 3.67 },
				{ type = bq_peaking  freq = 1900 q = 0.4567 gain = 3.67 },
                                { type = bq_peaking  freq = 2900 q = 0.4567 gain = 3.34567 },
                                #{ type = bq_peaking  freq = 5600 q = 0.4567   gain = -0.2367 },
                                { type = bq_peaking  freq = 8100 q = 0.4567 gain = 0.567 },
				{ type = bq_peaking  freq = 13000 q = 0.4567  gain = 7.69 }
                            ]
                            # SR
                            filters8 = [
				#{ type = bq_highpass freq = 23 },
                                #{ type = bq_highpass freq = 40 q = 1.33 },
				#{ type = bq_highpass freq = 88 q = 1.67 },
                                { type = bq_peaking  freq = 630  q = 0.4567 gain = 3.34567 },
                                { type = bq_peaking  freq = 1260 q = 0.4567 gain = 3.67 },
				{ type = bq_peaking  freq = 1900 q = 0.4567 gain = 3.67 },
                                { type = bq_peaking  freq = 2900 q = 0.4567 gain = 3.34567 },
                                #{ type = bq_peaking  freq = 5600 q = 0.4567   gain = -0.2367 },
                                { type = bq_peaking  freq = 8100 q = 0.4567 gain = 0.567 },
				{ type = bq_peaking  freq = 13000 q = 0.4567  gain = 7.69 }
                            ]
                        }
                    }
                    {
                        name    = sideL
                        type    = builtin
                        label   = mixer
                        control = {
                            "Gain 1" = 0.707106769084930419921875
                            "Gain 2" = -0.707106769084930419921875
                        }
                    }
                    {
                        name    = sideR
                        type    = builtin
                        label   = mixer
                        control = {
                            "Gain 1" = 0.707106769084930419921875
                            "Gain 2" = -0.707106769084930419921875
                        }
                    }

                    # apply hrir - HeSuVi 14-channel WAV (not the *-.wav variants) (note: */44/* in HeSuVi are the same, but resampled to 44100)
                    { type = builtin label = convolver name = convFL_R config = { filename = "hrir_hesuvi/hrir.wav" channel =  1 } }
                    { type = builtin label = convolver name = convFL_L config = { filename = "hrir_hesuvi/hrir.wav" channel =  0 } }
                    { type = builtin label = convolver name = convSL_L config = { filename = "hrir_hesuvi/hrir.wav" channel =  2 } }
                    { type = builtin label = convolver name = convSL_R config = { filename = "hrir_hesuvi/hrir.wav" channel =  3 } }
                    { type = builtin label = convolver name = convRL_L config = { filename = "hrir_hesuvi/hrir.wav" channel =  4 } }
                    { type = builtin label = convolver name = convRL_R config = { filename = "hrir_hesuvi/hrir.wav" channel =  5 } }
                    { type = builtin label = convolver name = convFC_L config = { filename = "hrir_hesuvi/hrir.wav" channel =  6 } }
                    { type = builtin label = convolver name = convFR_R config = { filename = "hrir_hesuvi/hrir.wav" channel =  7 } }
                    { type = builtin label = convolver name = convFR_L config = { filename = "hrir_hesuvi/hrir.wav" channel =  8 } }
                    { type = builtin label = convolver name = convSR_R config = { filename = "hrir_hesuvi/hrir.wav" channel =  9 } }
                    { type = builtin label = convolver name = convSR_L config = { filename = "hrir_hesuvi/hrir.wav" channel = 10 } }
                    { type = builtin label = convolver name = convRR_R config = { filename = "hrir_hesuvi/hrir.wav" channel = 11 } }
                    { type = builtin label = convolver name = convRR_L config = { filename = "hrir_hesuvi/hrir.wav" channel = 12 } }
                    { type = builtin label = convolver name = convFC_R config = { filename = "hrir_hesuvi/hrir.wav" channel = 13 } }

                    # treat LFE as FC
                    { type = builtin label = convolver name = convLFE_L config = { filename = "hrir_hesuvi/hrir.wav" channel =  6 } }
                    { type = builtin label = convolver name = convLFE_R config = { filename = "hrir_hesuvi/hrir.wav" channel = 13 } }



                    # stereo output
                    {   type = builtin label = mixer name = mixL }
                    {   type = builtin label = mixer name = mixR }
                ]
                links = [
                    # upmix
                    { output = "copyFL:Out"     input = "mixF:In 1" }
                    { output = "copyFR:Out"     input = "mixF:In 2" }
                    { output = "copyFL:Out"     input = "sideL:In 1" }
                    { output = "copyFR:Out"     input = "sideL:In 2" }
                    { output = "copyFR:Out"     input = "sideR:In 1" }
                    { output = "copyFL:Out"     input = "sideR:In 2" }

                    # eq
                    { output = "copyFL:Out"     input = "eq:In 1" }
                    { output = "copyFR:Out"     input = "eq:In 2" }
                    { output = "mixF:Out"       input = "eq:In 3" }
                    { output = "mixF:Out"       input = "eq:In 4" }
                    { output = "sideL:Out"      input = "eq:In 5" }
                    { output = "sideR:Out"      input = "eq:In 6" }
                    { output = "sideL:Out"      input = "eq:In 7" }
                    { output = "sideR:Out"      input = "eq:In 8" }

                    # convolution
                    { output = "eq:Out 1"  input="convFL_L:In"  }
                    { output = "eq:Out 1"  input="convFL_R:In"  }
                    { output = "eq:Out 7"  input="convSL_L:In"  }
                    { output = "eq:Out 7"  input="convSL_R:In"  }
                    { output = "eq:Out 5"  input="convRL_L:In"  }
                    { output = "eq:Out 5"  input="convRL_R:In"  }
                    { output = "eq:Out 3"  input="convFC_L:In"  }
                    { output = "eq:Out 2"  input="convFR_R:In"  }
                    { output = "eq:Out 2"  input="convFR_L:In"  }
                    { output = "eq:Out 8"  input="convSR_R:In"  }
                    { output = "eq:Out 8"  input="convSR_L:In"  }
                    { output = "eq:Out 6"  input="convRR_R:In"  }
                    { output = "eq:Out 6"  input="convRR_L:In"  }
                    { output = "eq:Out 3"  input="convFC_R:In"  }
                    { output = "eq:Out 4"  input="convLFE_L:In" }
                    { output = "eq:Out 4"  input="convLFE_R:In" }

                    # downmix output
                    { output = "convFL_L:Out"  input="mixL:In 1" }
                    { output = "convFL_R:Out"  input="mixR:In 1" }
                    { output = "convSL_L:Out"  input="mixL:In 2" }
                    { output = "convSL_R:Out"  input="mixR:In 2" }
                    { output = "convRL_L:Out"  input="mixL:In 3" }
                    { output = "convRL_R:Out"  input="mixR:In 3" }
                    { output = "convFC_L:Out"  input="mixL:In 4" }
                    { output = "convFC_R:Out"  input="mixR:In 4" }
                    { output = "convFR_R:Out"  input="mixR:In 5" }
                    { output = "convFR_L:Out"  input="mixL:In 5" }
                    { output = "convSR_R:Out"  input="mixR:In 6" }
                    { output = "convSR_L:Out"  input="mixL:In 6" }
                    { output = "convRR_R:Out"  input="mixR:In 7" }
                    { output = "convRR_L:Out"  input="mixL:In 7" }
                    { output = "convLFE_R:Out" input="mixR:In 8" }
                    { output = "convLFE_L:Out" input="mixL:In 8" }
                ]
                inputs  = [ "copyFL:In" "copyFR:In" ]
                outputs = [ "mixL:Out" "mixR:Out" ]
            }
            capture.props = {
                node.name       = "effect_input.stereo-upmix-virtual-surround-7.1-hesuvi"
                media.class     = Audio/Sink
                audio.channels  = 2
                audio.position  = [ FL FR ]
            }
            playback.props = {
                node.name       = "effect_output.stereo-upmix-virtual-surround-7.1-hesuvi"
                node.passive    = true
                audio.channels  = 2
                audio.position  = [ FL FR ]
            }
        }
    }
]
